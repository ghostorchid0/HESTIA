services:
  - type: web
    name: hestia
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_USERNAME
        value: superadmin
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@hestia.local
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: SMS_PROVIDER
        value: console
      - key: SMS_HTTP_URL
        sync: false
      - key: SMS_HTTP_KEY
        sync: false
      - key: SMS_SENDER
        value: Hestia
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@hestia.local
      - key: CHARIOW_API_KEY
        sync: false
      - key: CHARIOW_WEBHOOK_SECRET
        sync: false
      - key: CHARIOW_STORE_URL
        value: https://dkqhkbvr.mychariow.online
      - key: SUBSCRIPTION_PRICE_XOF
        value: 30000
      - key: SUBSCRIPTION_CURRENCY
        value: XOF
      - key: SUBSCRIPTION_FEE_PERCENT
        value: 15
      - key: CHARIOW_PRICE_XOF
        value: 35500
